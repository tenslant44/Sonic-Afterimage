<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sonic Afterimage</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="424" height="240"></canvas>
</div>
<div id="touch">
  <div id="dpad">
    <button data-k="left">◀</button><button data-k="up">▲</button><button data-k="down">▼</button><button data-k="right">▶</button>
  </div>
  <div id="btns">
    <button data-k="start" class="small">START</button>
    <button data-k="jump" class="big">A</button>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
